<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css"/>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <div class="main">
        <div class="headr">
            <h1>Student Login</h1>
            <p class="p-1">Access your student account</p>
        </div>

        <form action="">
            <label for="first">
                Email or Student ID
            </label>
            <input type="text" id="first" name="first" 
                placeholder="Enter your email or student ID" required class="entr">

            <label for="password">
                Password
            </label>
            <input type="password" id="password" name="password" 
                placeholder="Enter your password" required class="entr">

            <div class="rembr">
                <input type="checkbox" id="remb" name="remb" checked class="checkbox"/>
                <label for="Remember">Remember me</label>
                <a href="#" class="forgot">
                    Forgot password?
                </a>
            </div>    

            <div class="wrap">
                <button type="submit">
                    Log In
                </button>
            </div>
        </form>

        <div class="or">
           <span class="dev"></span>
           <span>OR</span>
           <span class="dev"></span>
        </div>
        <div class="icons">
            <div class="icons-c">
                <img src="img/google-icon.png" alt="google icon"/>
            </div>
            <div class="icons-c">
                <img src="img/win-icon.png" alt="win icon"/>
            </div> 
            <div class="icons-c">
                <img src="img/apple-icon.png" alt="apple icon"/>
            </div>
        </div>
        
        
        <p class="dhaa">Don't have an account?
            <a href="signup.html" class="register">
                Register
            </a>
        </p>
    </div>
    
</body>
</html>
