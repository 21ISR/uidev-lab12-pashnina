<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css"/>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Register</title>
</head>
<body>
    <div class="main">
        <div class="headr">
            <h1>Student Registration</h1>
            <p class="p-1">Create your student account</p>
        </div>

        <form action="">
            <label for="first">
                Full name
            </label>
            <input type="text" id="first" name="first" 
                placeholder="Enter your full name" required class="entr">
            <label for="second">
                Email Address
            </label>
            <input type="text" id="second" name="second" 
                placeholder="Enter your email" required class="entr">
            <label for="third">
                Student ID
            </label>
            <input type="text" id="third" name="third"
                placeholder="Enter your student ID" required class="entr">
            <label for="fourth">
                Select Program
            </label>

            <select name="Choose your program">
                <option value="option1">Computer Science</option>
                <option value="option2">Engineering</option>
                <option value="option3">Business</option>
                <option value="option4">Arts & Humanities</option>
                <option value="option5">Science</option>
            </select>

            <label for="password">
                Password
            </label>
            <input type="password" id="password" name="password" 
                placeholder="Enter your password" required class="entr">

            <label for="confirm_password">
                Confirm Password
            </label>
            <input type="password" id="confirm_password" name="confirm_password" 
                placeholder="Confirm your password" required class="entr">

            <div class="rembr">
                <input type="checkbox" id="remb" name="remb" checked class="checkbox"/>
                <label for="Agree" class="agree">I agree to the Terms of Service and Privacy Policy</label>
            </div>    

            <div class="wrap">
                <button type="submit">
                    Log In
                </button>
            </div>
        </form>

        
        
        
        <p class="ahaa">Already have an account?
            <a href="index.html" class="register">
                Log in
            </a>
        </p>
    </div>
    
</body>
</html>
